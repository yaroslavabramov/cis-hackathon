<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>La Mirage · stage</title>
<style>
  html, body { margin: 0; height: 100%; background: #08090b; color: #e8eaed; font: 15px/1.45 -apple-system, "Inter", system-ui, sans-serif; overflow: hidden; }
  body { display: grid; grid-template-columns: 440px 1fr; }
  .term { display: flex; flex-direction: column; border-right: 1px solid #22262e; background: #050607; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #1a1d23; color: #8a93a2; font-size: 13px; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .lines { flex: 1; padding: 12px 14px; font: 12px/1.5 "SF Mono", ui-monospace, Menlo, monospace; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; white-space: pre-wrap; word-break: break-word; }
  .l-green { color: #34d399; } .l-red { color: #f87171; } .l-yellow { color: #fbbf24; } .l-cyan { color: #67e8f9; } .l-dim { color: #6b7280; }
  .l-title { color: #a78bfa; font-weight: 700; margin-top: 10px; }
  iframe { border: 0; width: 100%; height: 100%; }
  .caption { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); max-width: 1300px; padding: 12px 22px; border-radius: 14px;
    background: rgba(5, 6, 8, .88); border: 1px solid #2a2f38; font-size: 21px; line-height: 1.4; text-align: center; color: #f3f4f6; }
  .caption:empty { display: none; }
  .hint { position: fixed; left: 14px; bottom: 12px; font: 12px "SF Mono", Menlo, monospace; color: #a78bfa; background: #151022;
    border: 1px solid #3b3168; border-radius: 8px; padding: 6px 10px; }
  .hint:empty { display: none; }
</style>
</head>
<body>
  <div class="term">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span style="margin-left:10px">attacker's laptop</span></div>
    <div class="lines" id="lines"></div>
  </div>
  <iframe src="/console?embed=1"></iframe>
  <div class="caption" id="caption"></div>
  <div class="hint" id="hint"></div>
<script>
  const esc = (v) => String(v).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  async function poll() {
    try {
      const s = await (await fetch("/api/stage")).json();
      document.getElementById("lines").innerHTML = s.lines.slice(-48).map((l) => `<div class="l-${l.color}">${esc(l.text) || "&nbsp;"}</div>`).join("");
      document.getElementById("caption").textContent = s.caption;
      document.getElementById("hint").textContent = s.hint ? `${s.hint}  ·  press → or Space` : "";
    } catch (e) {}
    setTimeout(poll, 250);
  }
  poll();
  const next = () => fetch("/api/stage", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ next: true }) });
  addEventListener("keydown", (e) => { if (["ArrowRight", " ", "Enter", "PageDown"].includes(e.key)) { e.preventDefault(); next(); } });
  window.addEventListener("message", (e) => { if (e.data === "mirage-next") next(); });
</script>
</body>
</html>
